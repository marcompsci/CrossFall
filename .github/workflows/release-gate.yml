name: Release gate

# Runs on every push and pull request. Before a TestFlight upload, both jobs must be green.
# A job that is skipped or cancelled is NOT a pass.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-smoke:
    name: Static checks + headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Release gate (fails on any FAIL)
        run: python3 scripts/release_gate.py --smoke

  ios-build:
    name: Xcode build (iOS Simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Lint plists and entitlements
        run: |
          plutil -lint Crossfall/PrivacyInfo.xcprivacy CrossfallWidget/PrivacyInfo.xcprivacy \
            Crossfall/Crossfall.entitlements CrossfallWidget/CrossfallWidget.entitlements CrossfallWidget/Info.plist
      - name: Build app + widget (Release, simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild -project Crossfall.xcodeproj -scheme Crossfall -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 60
      - name: Privacy manifests, fonts and Info.plist keys are inside the built app
        shell: bash {0}   # no -e: run every check and report each one
        run: |
          APP=build/DD/Build/Products/Release-iphonesimulator/Crossfall.app
          WID=$(ls -d "$APP"/PlugIns/*.appex 2>/dev/null | head -1)
          fail=0; passed=""
          chk() { if eval "$2"; then echo "PASS  $1"; passed="$passed; $1"; else echo "FAIL  $1"; echo "::error title=Bundle check failed::$1"; fail=1; fi; }
          chk "app built at $APP"                 "test -d '$APP'"
          chk "widget extension embedded ($WID)"  "test -n '$WID'"
          chk "app privacy manifest bundled"      "test -f '$APP/PrivacyInfo.xcprivacy'"
          chk "widget privacy manifest bundled"   "test -f '$WID/PrivacyInfo.xcprivacy'"
          chk "index.html bundled"                "test -f '$APP/index.html'"
          n=$(find "$APP" -name '*.woff2' 2>/dev/null | wc -l | tr -d ' ')
          chk "5 fonts bundled (found $n)" "test '$n' = 5"
          for f in $(grep -o '[a-z0-9-]*\.woff2' "$APP/index.html" 2>/dev/null | sort -u); do chk "font $f at the path index.html uses" "test -f '$APP/$f'"; done
          for k in ITSAppUsesNonExemptEncryption NSLocationWhenInUseUsageDescription NSGKFriendListUsageDescription CFBundleVersion CFBundleShortVersionString; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" 2>/dev/null)
            chk "Info.plist $k = ${v:0:40}" "test -n \"\$v\""; done
          echo "::notice title=Bundle checks passed::${passed#; }"
          exit $fail
